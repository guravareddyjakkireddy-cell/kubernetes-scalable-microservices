apiVersion: apps/v1
kind: Deployment
metadata:
  name: week12-microservice
  namespace: week12-microservices

spec:
  replicas: 3

  selector:
    matchLabels:
      app: week12-microservice

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: week12-microservice

    spec:
      containers:
      - name: week12-microservice
        image: week12-microservice:latest

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - configMapRef:
            name: week12-config

        - secretRef:
            name: week12-secret
